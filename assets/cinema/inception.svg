<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t">
  <title id="t">رسم لنحلة (لعبة بتلف) على ترابيزة، ووراها مدينة بتتطوي لفوق تحت سما فيها نجوم</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18233a"/>
      <stop offset=".5" stop-color="#2c3f5a"/>
      <stop offset="1" stop-color="#4b6b7e"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a2a"/>
      <stop offset=".5" stop-color="#e2b35a"/>
      <stop offset="1" stop-color="#8a6a2a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <g fill="#e8ecef" opacity=".8">
    <circle cx="120" cy="420" r="2"/><circle cx="1080" cy="390" r="2.2"/><circle cx="960" cy="460" r="1.6"/><circle cx="240" cy="470" r="1.8"/>
  </g>
  <!-- ground city (bottom) -->
  <g fill="#1d2b3c">
    <rect x="0" y="470" width="90" height="150"/><rect x="85" y="430" width="70" height="190"/><rect x="150" y="480" width="110" height="140"/>
    <rect x="255" y="440" width="60" height="180"/><rect x="880" y="450" width="80" height="170"/><rect x="955" y="420" width="70" height="200"/>
    <rect x="1020" y="470" width="110" height="150"/><rect x="1125" y="440" width="75" height="180"/>
  </g>
  <!-- folded city (upside down, top) -->
  <g fill="#24364a">
    <rect x="0" y="0" width="100" height="170"/><rect x="95" y="0" width="70" height="220"/><rect x="160" y="0" width="120" height="150"/>
    <rect x="275" y="0" width="70" height="200"/><rect x="345" y="0" width="90" height="130"/><rect x="760" y="0" width="90" height="140"/>
    <rect x="850" y="0" width="70" height="210"/><rect x="915" y="0" width="120" height="160"/><rect x="1030" y="0" width="80" height="230"/><rect x="1105" y="0" width="95" height="170"/>
  </g>
  <g fill="#e2b35a" opacity=".5">
    <rect x="110" y="120" width="12" height="16"/><rect x="190" y="60" width="12" height="16"/><rect x="880" y="150" width="12" height="16"/><rect x="1050" y="90" width="12" height="16"/>
    <rect x="100" y="470" width="12" height="16"/><rect x="980" y="480" width="12" height="16"/><rect x="200" y="520" width="12" height="16"/><rect x="1060" y="520" width="12" height="16"/>
  </g>
  <!-- table -->
  <path d="M0 620 L1200 620 L1200 800 L0 800 Z" fill="#3a2c22"/>
  <path d="M0 620 L1200 620 L1200 640 L0 640 Z" fill="#4d3b2d"/>
  <!-- spinning top with motion arcs -->
  <ellipse cx="600" cy="628" rx="70" ry="10" fill="#000" opacity=".35"/>
  <g transform="translate(600 520) rotate(-6)">
    <path d="M0 -70 L0 -40" stroke="#c9b27a" stroke-width="8" stroke-linecap="round"/>
    <path d="M-80 -40 C-80 -60 80 -60 80 -40 C80 -5 30 40 0 100 C-30 40 -80 -5 -80 -40 Z" fill="url(#top)" stroke="#5c4519" stroke-width="3"/>
    <ellipse cx="0" cy="-40" rx="80" ry="16" fill="#f0cf86" stroke="#5c4519" stroke-width="3"/>
  </g>
  <g fill="none" stroke="#e8ecef" stroke-width="3" opacity=".55" stroke-linecap="round">
    <path d="M490 470 q-30 40 0 80"/><path d="M710 470 q30 40 0 80"/>
    <path d="M460 455 q-44 55 0 110"/><path d="M740 455 q44 55 0 110"/>
  </g>
</svg>
