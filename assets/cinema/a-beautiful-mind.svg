  <!-- desk and lamp -->
  <rect x="0" y="690" width="1200" height="110" fill="#2b2420"/>
  <path d="M1010 690 L1040 560 L1100 540 L1110 560 L1060 580 L1040 690 Z" fill="#3a3f4a"/>
  <path d="M1080 535 L1150 520 L1160 575 L1095 590 Z" fill="#b9862a"/>
  <ellipse cx="1120" cy="690" rx="120" ry="18" fill="#f2d48a" opacity=".18"/>
  <rect x="120" y="660" width="160" height="30" fill="#efe6d2"/><rect x="135" y="645" width="140" height="18" fill="#d9cdb3"/>
