<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t">
  <title id="t">رسم لشباك بالليل عليه معادلات ورموز رياضية منوّرة ونقط متوصلة ببعض</title>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2a"/>
      <stop offset="1" stop-color="#22324a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="#18233a"/>
  <!-- window -->
  <rect x="210" y="90" width="780" height="560" fill="url(#night)" stroke="#d9cdb3" stroke-width="14"/>
  <line x1="600" y1="90" x2="600" y2="650" stroke="#d9cdb3" stroke-width="10"/>
  <line x1="210" y1="370" x2="990" y2="370" stroke="#d9cdb3" stroke-width="10"/>
  <!-- stars -->
  <g fill="#e8ecef">
    <circle cx="270" cy="140" r="2.5"/><circle cx="930" cy="160" r="2"/><circle cx="520" cy="120" r="2"/><circle cx="880" cy="600" r="2.2"/>
    <circle cx="300" cy="590" r="2"/><circle cx="700" cy="130" r="1.8"/>
  </g>
  <!-- glowing network of points (pattern-seeking) -->
  <g stroke="#e2b35a" stroke-width="2.5" opacity=".85">
    <line x1="300" y1="210" x2="420" y2="280"/><line x1="420" y1="280" x2="520" y2="200"/><line x1="520" y1="200" x2="680" y2="250"/>
    <line x1="680" y1="250" x2="800" y2="190"/><line x1="800" y1="190" x2="900" y2="290"/><line x1="420" y1="280" x2="460" y2="470"/>
    <line x1="460" y1="470" x2="640" y2="520"/><line x1="640" y1="520" x2="780" y2="450"/><line x1="780" y1="450" x2="900" y2="290"/>
    <line x1="680" y1="250" x2="640" y2="520"/>
  </g>
  <g fill="#f6d27a">
    <circle cx="300" cy="210" r="8"/><circle cx="420" cy="280" r="8"/><circle cx="520" cy="200" r="8"/><circle cx="680" cy="250" r="8"/>
    <circle cx="800" cy="190" r="8"/><circle cx="900" cy="290" r="8"/><circle cx="460" cy="470" r="8"/><circle cx="640" cy="520" r="8"/><circle cx="780" cy="450" r="8"/>
  </g>
  <!-- chalk-like math symbols (generic) -->
  <g fill="none" stroke="#bfe3d8" stroke-width="4" stroke-linecap="round" opacity=".8">
    <path d="M260 430 q20 -40 40 0 t40 0"/>
    <path d="M250 520 h60 M280 490 v60"/>
    <path d="M840 520 l40 -40 M840 480 l40 40"/>
    <path d="M880 600 q-30 -30 0 -60"/>
    <path d="M330 610 h50 M330 625 h50"/>
    <path d="M700 600 a24 24 0 1 0 0.1 0"/>
