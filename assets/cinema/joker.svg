      <stop offset="0" stop-color="#1b2433"/>
      <stop offset=".6" stop-color="#3a3348"/>
      <stop offset="1" stop-color="#6b4a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".5">
      <stop offset="0" stop-color="#e2b35a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#e2b35a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- distant skyline -->
  <g fill="#262c3b">
