    <path d="M445 760 L755 760 L755 725 L445 725 Z"/>
    <path d="M460 725 L740 725 L740 693 L460 693 Z"/>
    <path d="M474 693 L726 693 L726 664 L474 664 Z"/>
    <path d="M487 664 L713 664 L713 638 L487 638 Z"/>
