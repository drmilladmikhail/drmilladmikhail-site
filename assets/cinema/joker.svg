<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t">
  <title id="t">رسم لسلّم طويل بين عمارات مدينة بالليل، وفوقه قناعين مسرح واحد بيضحك وواحد بيعيط</title>
  <defs>
