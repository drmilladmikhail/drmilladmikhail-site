    <rect x="170" y="360" width="14" height="18"/><rect x="1000" y="300" width="14" height="18"/><rect x="1040" y="360" width="14" height="18"/>
    <rect x="1110" y="350" width="14" height="18"/><rect x="1150" y="410" width="14" height="18"/>
