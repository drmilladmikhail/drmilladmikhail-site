name: Diagnose homepage width
on:
  push:
    branches: [feature/research-library]
    paths: ['.github/workflows/layout-diagnostics.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/layout-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install pillow playwright
          # Ubuntu apt mirrors are sometimes unreachable from runners (2026-11-11 outage).
          # The runner image already has Chrome's system libraries, so try without apt first.
          python -m playwright install chromium
          if python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); p.chromium.launch().close(); p.stop()"; then
            echo "Chromium runs without extra system packages"
          else
            for i in 1 2 3; do python -m playwright install --with-deps chromium && break; [ "$i" = 3 ] && exit 1; echo "apt failed, retrying in 45s"; sleep 45; done
          fi
          curl --fail --silent --show-error --retry 3 https://raw.githubusercontent.com/drmilladmikhail/drmilladmikhail-site/188870a6cb6b293e7f94b5090fa346c6b96d058d/tools/home_clarity.py -o tools/home_clarity.py
          curl --fail --silent --show-error --retry 3 https://raw.githubusercontent.com/drmilladmikhail/drmilladmikhail-site/188870a6cb6b293e7f94b5090fa346c6b96d058d/assets/home-clarity.css -o assets/home-clarity.css
          python tools/growth_package.py
          python tools/build_articles.py
      - name: Identify exact viewport and overflowing elements without changing live site
        id: scan
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          sys.path.insert(0, 'tools')
          import home_clarity
          reports = []
          Path('layout-artifacts').mkdir(exist_ok=True)
          js = r"""() => {
            const viewport = innerWidth;
            const width = document.documentElement.scrollWidth;
            const elements = [...document.querySelectorAll('body *')].filter(el => {
              if (el.matches('.skip-link, script, style, [hidden]')) return false;
              const r = el.getBoundingClientRect();
              const s = getComputedStyle(el);
              return r.width > 0 && r.height > 0 && s.visibility !== 'hidden' && s.position !== 'fixed' && (r.right > viewport + 1 || r.left < -1);
            }).slice(0, 8).map(el => ({
              selector: el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') + (typeof el.className === 'string' && el.className.trim() ? '.' + el.className.trim().split(/\s+/).slice(0, 3).join('.') : ''),
              left: Math.round(el.getBoundingClientRect().left),
              right: Math.round(el.getBoundingClientRect().right)
            }));
            return {viewport, width, overflow: width > viewport, elements};
          }"""
          server = subprocess.Popen(['python', '-m', 'http.server', '8765', '--bind', '127.0.0.1'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          try:
              time.sleep(2)
              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  for variant in ['baseline', 'refreshed']:
                      if variant == 'refreshed':
                          home_clarity.apply(Path('.'))
                      for width in [390, 1280]:
                          page = browser.new_page(viewport={'width': width, 'height': 900})
                          response = page.goto('http://127.0.0.1:8765/', wait_until='domcontentloaded')
                          assert response.status == 200
                          data = page.evaluate(js)
                          data.update({'variant': variant})
                          reports.append(data)
                          page.screenshot(path=f'layout-artifacts/{variant}-{width}.png', full_page=True)
                          page.close()
                  browser.close()
          finally:
              server.terminate()
              server.wait(timeout=10)
          Path('layout-artifacts/report.json').write_text(json.dumps(reports, indent=2), encoding='utf-8')
          matrix = []
          for report in reports:
              selectors = ','.join(el['selector'] for el in report['elements']) if report['overflow'] else 'OK'
              detail = str(report['width']) + 'px ' + re.sub(r'[^a-zA-Z0-9 ._#,:-]', '', selectors)[:150]
              matrix.append({'variant': report['variant'], 'width': report['viewport'], 'detail': detail, 'overflow': report['overflow']})
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('matrix=' + json.dumps({'include': matrix}) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-width-diagnostics
          path: layout-artifacts/
          retention-days: 7
  result:
    needs: inspect
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inspect.outputs.matrix) }}
    name: "Layout ${{ matrix.variant }} ${{ matrix.width }}px | ${{ matrix.detail }}"
    runs-on: ubuntu-latest
    steps:
      - name: Keep overflow visible as a failing diagnostic
        if: matrix.overflow
        run: exit 1
      - name: Width fits viewport
        if: ${{ !matrix.overflow }}
        run: echo 'No horizontal overflow detected for this variant and viewport.'
