name: Live check (one-off)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -sSL https://drmilladmikhail.com/ -o h.html
          echo "size $(wc -c < h.html)"
          for m in 'fm=webp' 'auto=format' 'VIDEOS:START' 'skip-link' 'cloudflareinsights' 'vtag' 'love-p09.webp 1000w' 'love-p09.webp 1200w'; do echo "$m: $(grep -c "$m" h.html)"; done
          grep -oE '<script[^>]*netlify[^>]*>' h.html | head -3
          grep -oE 'https?://[^"'"'"' ]*netlify[^"'"'"' ]*' h.html | sort -u | head
          for u in videos/ tests/anxiety-gad7/ assets/videos.js; do echo "$u: $(curl -s -o /dev/null -w '%{http_code}' https://drmilladmikhail.com/$u)"; done
          curl -sSI https://drmilladmikhail.netlify.app/ | grep -iE '^(HTTP|x-nf|age|last-modified|etag)'
