# Safety net after every push: makes sure every HTML page has the
# Cloudflare Web Analytics snippet (tools/add_analytics.py). New pages made by
# any scheduled task or script get it here even if their template forgot it.
name: Site checks

on:
  push:
    branches: [main]
    paths: ["**.html"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add analytics snippet where missing
        run: python3 tools/add_analytics.py
      - name: Commit if anything changed
        run: |
          git config user.name "site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- '*.html'
          if git diff --cached --quiet; then
            echo "All pages already have analytics."
          else
            git commit -m "Add analytics snippet to new pages"
            git pull --rebase --quiet origin main
            git push
          fi
