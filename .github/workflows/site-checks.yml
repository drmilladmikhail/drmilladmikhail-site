name: Site checks

on:
  push:
    branches: [main]
    paths: ["**.html", "tools/add_analytics.py", "tools/start_journey.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize pages and start journey
        run: python3 tools/add_analytics.py
      - name: Commit if anything changed
        run: |
          git config user.name "site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- '*.html'
          if git diff --cached --quiet; then
            echo "Pages already up to date."
          else
            git commit -m "Finalize pages and start journey"
            git pull --rebase --quiet origin main
            git push
          fi
