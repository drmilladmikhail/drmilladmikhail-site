# Pulls visitor statistics from Cloudflare Web Analytics on the 1st and 16th of
# every month (and on demand). The numbers are printed to this job's log
# (between STATS-JSON-BEGIN/END) — not committed, because this repository is
# public. The scheduled task «تقرير زوار الموقع» reads the log, deletes it,
# and writes the report.
# Needs the repository secret CF_API_TOKEN (Account Analytics: Read).
name: Site stats

on:
  schedule:
    - cron: "7 13 1,16 * *"   # 1st and 16th, about 8:07 AM New York time
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back"
        default: "15"

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch from Cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: c5d901539d438b6b43d772bece1d75d4  # not secret
        run: python3 tools/fetch_stats.py --days "${{ github.event.inputs.days || '15' }}" --out stats.json
