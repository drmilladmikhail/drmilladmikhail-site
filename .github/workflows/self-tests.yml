name: Self-test build and browser checks

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/build_tests.py"
      - "tools/build_articles.py"
      - "assets/quiz.js"
      - "tests/**"
      - "sitemap.xml"
      - ".github/workflows/self-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install browser test tools
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Rebuild self-tests and sitemap
        run: |
          python3 tools/build_tests.py
          python3 tools/build_articles.py
      - name: Verify generated files are committed
        run: git diff --exit-code -- tests/index.html tests/tests.json tests/depression-cesd/index.html sitemap.xml llms.txt
      - name: Run scoring and mobile smoke tests
        run: |
          python -m http.server 8765 >/tmp/site-http.log 2>&1 &
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          time.sleep(2)
          errors = []
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 390, "height": 844})
              page.on("pageerror", lambda error: errors.append(str(error)))
              page.goto("http://127.0.0.1:8765/tests/depression-cesd/", wait_until="load")
              assert page.locator("fieldset.q").count() == 20
              assert page.evaluate("document.documentElement.scrollWidth <= window.innerWidth")

              def answer(which):
                  for q in page.locator("fieldset.q").all():
                      options = q.locator("label.opt")
                      (options.first if which == "first" else options.last).click()
                  page.locator('#quiz button[type="submit"]').click()
                  return page.locator("#result").inner_text()

              assert "12 من 60" in answer("first")
              page.locator("#result .again").click()
              for i in range(1, 21):
                  page.locator("fieldset.q").nth(i - 1).locator("label.opt").first.click()
              for i in (1, 2, 3):
                  page.locator("fieldset.q").nth(i - 1).locator("label.opt").nth(1).click()
              page.locator('#quiz button[type="submit"]').click()
              assert "15 من 60" in page.locator("#result").inner_text()
              page.locator("#result .again").click()
              for i in range(1, 21):
                  page.locator("fieldset.q").nth(i - 1).locator("label.opt").first.click()
              for i in (1, 2, 3, 5):
                  page.locator("fieldset.q").nth(i - 1).locator("label.opt").nth(1).click()
              page.locator('#quiz button[type="submit"]').click()
              assert "16 من 60" in page.locator("#result").inner_text()
              assert page.locator("#result .result-alert").count() == 1

              page.locator("#result .again").click()
              assert "48 من 60" in answer("last")

              page.goto("http://127.0.0.1:8765/tests/depression-phq8/", wait_until="load")
              assert page.locator("fieldset.q").count() == 8
              for q in page.locator("fieldset.q").all():
                  q.locator("label.opt").first.click()
              page.locator('#quiz button[type="submit"]').click()
              assert "0 من 24" in page.locator("#result").inner_text()
              assert not errors, errors
              browser.close()
          PY